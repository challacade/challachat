<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChallaChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/styles.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <div class="app">
    <!-- ── Header ───────────────────────────────────────────── -->
    <header>
      <h1>
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        ChallaChat
      </h1>
      <div class="server-status">
        <span class="status-dot" id="serverDot"></span>
        <span id="serverStatus">Starting&hellip;</span>
      </div>
    </header>

    <!-- ── Scrollable body ──────────────────────────────────── -->
    <main>

      <!-- Connect ------------------------------------------------ -->
      <section class="card" id="connectSection">
        <h3>Livestream URL</h3>
        <div class="input-row">
          <input
            type="text"
            id="urlInput"
            placeholder="Paste a YouTube, Twitch, or Kick URL…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="connectBtn" class="btn primary">Connect</button>
        </div>
        <div id="connectError" class="error hidden"></div>
      </section>

      <!-- Active capture ----------------------------------------- -->
      <section class="card hidden" id="captureSection">
        <div class="capture-header">
          <span id="platformBadge" class="platform-badge"></span>
          <span id="captureUrl" class="capture-url"></span>
        </div>

        <div class="stats-row">
          <div class="stat">
            <span class="stat-value" id="messageCount">0</span>
            <span class="stat-label">Messages</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="uptime">0s</span>
            <span class="stat-label">Uptime</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="pollDisplay">1 s</span>
            <span class="stat-label">Poll Rate</span>
          </div>
        </div>

        <!-- Poll interval slider (only visible while capturing) -->
        <div class="slider-row">
          <label for="pollSlider">Poll interval</label>
          <input type="range" id="pollSlider" min="100" max="5000" step="100" value="1000" />
          <span id="pollValue" class="slider-value">1.0 s</span>
        </div>

        <button id="disconnectBtn" class="btn danger full-width">Disconnect</button>
      </section>

      <!-- Settings ------------------------------------------------ -->
      <section class="card settings-card">
        <h3>Settings</h3>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Chat filter</span>
            <span class="setting-meta" id="filterMeta">—</span>
          </div>
          <div class="setting-actions">
            <button id="filterReloadBtn" class="btn small ghost" title="Reload word list">↻</button>
            <label class="toggle">
              <input type="checkbox" id="filterToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Chat logger</span>
            <span class="setting-meta" id="loggerMeta">—</span>
          </div>
          <div class="setting-actions">
            <label class="toggle">
              <input type="checkbox" id="loggerToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Jam mode</span>
            <span class="setting-meta" id="jamMeta">—</span>
          </div>
          <div class="setting-actions">
            <label class="toggle">
              <input type="checkbox" id="jamToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- OBS Overlay URL ---------------------------------------- -->
      <section class="card overlay-card">
        <h3>OBS Browser Source</h3>
        <div class="copy-row">
          <code id="overlayUrl">http://localhost:5050</code>
          <button id="copyBtn" class="btn small ghost" title="Copy URL">📋</button>
        </div>
        <p class="hint">Add this URL as a Browser Source in OBS (or similar).</p>
      </section>

    </main>

    <!-- ── Footer ───────────────────────────────────────────── -->
    <footer>
      <span>Visit <a href="https://challachat.com" target="_blank">challachat.com</a> for more info</span>
    </footer>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
