<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChallaChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <style> body { background: transparent; } </style>
  <!-- Overlay served at / and /overlay; connects to /api/stream -->
</head>
<body>
  <div id="overlay" class="overlay">
    <div id="songDisplayOverlay" class="song-display-overlay hidden"><span class="song-display-text"></span></div>
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="toast" class="toast hidden"></div>
    <button id="settingsBtn" class="settings-btn appearance hidden" aria-label="Appearance">🎨</button>
  <button id="generalSettingsBtn" class="settings-btn general hidden" aria-label="Settings">⚙️</button>
  </div>
  <div id="settings" class="settings hidden">
    <h2>Appearance</h2>





  </div>

  <!-- General Settings Panel -->
  <div id="generalSettings" class="settings hidden">
    <h2>Settings</h2>
    <div class="censor-row">
      <label class="checkbox-label">
        <input id="demoMode" type="checkbox" />
        <span>Demo Mode</span>
      </label>
    </div>
    <div class="censor-row">
      <label class="checkbox-label">
        <input id="censorEnabled" type="checkbox" checked />
        <span>Censor Filter</span>
      </label>
      <div id="censorStatus" class="status-message hidden"></div>
    </div>
    <div class="censor-row">
      <label class="checkbox-label">
        <input id="logEnabled" type="checkbox" />
        <span>Log Messages</span>
      </label>
      <div id="logStatus" class="status-message hidden"></div>
    </div>
    <div class="grid">
      <label>
        Poll Interval (ms)
  <input id="pollIntervalMs" type="number" min="100" step="100" value="1000" />
      </label>
    </div>
    <div class="row">
      <button id="clearMessagesBtn" class="secondary" title="Clear all messages from the overlay">Clear All Messages</button>
      <button id="copyUrlBtn" class="secondary">Copy URL With Settings</button>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
