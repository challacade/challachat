<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChallaChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Acme&family=Arvo:wght@400;700&family=Cousine:wght@400;700&family=Exo+2:wght@400;600;700&family=Inter:wght@400;600;800&family=Lexend:wght@400;500;700&family=Lora:wght@400;600;700&family=News+Cycle:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <style> body { background: transparent; } </style>
  <!-- Overlay served at / and /overlay; connects to /api/stream -->
</head>
<body>
  <div id="overlay" class="overlay">
    <div id="songDisplayOverlay" class="song-display-overlay hidden"><span class="song-display-text"></span></div>
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
