<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChallaChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <style> body { background: transparent; } </style>
  <!-- Overlay served at / and /overlay; connects to /api/stream -->
</head>
<body>
  <div id="overlay" class="overlay">
    <div id="songDisplayOverlay" class="song-display-overlay hidden"><span class="song-display-text"></span></div>
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="toast" class="toast hidden"></div>
    <button id="settingsBtn" class="settings-btn appearance hidden" aria-label="Appearance">🎨</button>
  <button id="soundSettingsBtn" class="settings-btn sound hidden" aria-label="Sound Settings">🔊</button>
  <button id="musicSettingsBtn" class="settings-btn music hidden" aria-label="Music">🎵</button>
  <button id="generalSettingsBtn" class="settings-btn general hidden" aria-label="Settings">⚙️</button>
  </div>
  <div id="settings" class="settings hidden">
    <h2>Appearance</h2>





  </div>

  <!-- Sound Settings Panel -->
  <div id="soundSettings" class="settings hidden">
    <h2>Sound Settings</h2>
    <div class="grid sound-grid">
      <label class="span-2">
        Message Volume
        <input id="msgVolume" type="range" min="0" max="2" step="0.05" value="1" />
      </label>
      <button id="testMessageBtn" class="secondary" title="Play sample message sound">Test</button>
    </div>
    <div class="grid sound-grid">
      <label class="span-2">
        Donation Volume
        <input id="donationVolume" type="range" min="0" max="2" step="0.05" value="1" />
      </label>
      <button id="testDonationBtn" class="secondary" title="Play sample donation sound">Test</button>
    </div>
    <div class="grid sound-grid">
      <label class="span-2">
        Membership Volume
        <input id="memberVolume" type="range" min="0" max="2" step="0.05" value="1" />
      </label>
      <button id="testMemberBtn" class="secondary" title="Play sample membership sound">Test</button>
    </div>
  </div>

  <!-- General Settings Panel -->
  <div id="generalSettings" class="settings hidden">
    <h2>Settings</h2>
    <div class="censor-row">
      <label class="checkbox-label">
        <input id="demoMode" type="checkbox" />
        <span>Demo Mode</span>
      </label>
    </div>
    <div class="censor-row">
      <label class="checkbox-label">
        <input id="censorEnabled" type="checkbox" checked />
        <span>Censor Filter</span>
      </label>
      <div id="censorStatus" class="status-message hidden"></div>
    </div>
    <div class="censor-row">
      <label class="checkbox-label">
        <input id="logEnabled" type="checkbox" />
        <span>Log Messages</span>
      </label>
      <div id="logStatus" class="status-message hidden"></div>
    </div>
    <div class="grid">
      <label>
        Poll Interval (ms)
  <input id="pollIntervalMs" type="number" min="100" step="100" value="1000" />
      </label>
    </div>
    <div class="row">
      <button id="clearMessagesBtn" class="secondary" title="Clear all messages from the overlay">Clear All Messages</button>
      <button id="copyUrlBtn" class="secondary">Copy URL With Settings</button>
    </div>
  </div>

  <!-- Music Settings Panel -->
  <div id="musicSettings" class="settings hidden">
    <h2>Music</h2>
    <div id="musicCurrentTitle" class="music-current-title"></div>
    <div class="grid sound-grid">
      <label class="span-2">
        <input id="musicVolume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Music volume" />
      </label>
    </div>
    <div class="row">
      <button id="musicPrevBtn" class="secondary">Previous</button>
      <button id="musicPlayBtn" class="secondary">Play</button>
      <button id="musicNextBtn" class="secondary">Next</button>
      <button id="musicShuffleBtn" class="secondary">Shuffle</button>
    </div>
    <div class="grid music-display-row">
      <label>
        Song Display
        <select id="musicSongDisplay">
          <option value="none">None</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
        </select>
        <div id="songDisplaySelect" class="select-custom" aria-hidden="true"></div>
      </label>
    </div>
    <div class="censor-row">
      <label class="checkbox-label">
        <input id="scrollSongDisplay" type="checkbox" />
        <span>Scroll song display</span>
      </label>
    </div>
    <div class="censor-row music-write-row">
      <label class="checkbox-label">
        <input id="musicWriteSongFile" type="checkbox" />
        <span>Write current song details</span>
      </label>
    </div>
    <div class="censor-row music-write-row">
      <label class="checkbox-label">
        <input id="musicEnableJam" type="checkbox" />
        <span>Enable !jam</span>
      </label>
    </div>
    <!--<div class="censor-row">
      <div>Music Path</div>
      <div id="musicPathDisplay" class="status-message"></div>
    </div>-->
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
