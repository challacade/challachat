name: Build Full Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (example: v1.5.0)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci || npm install
      - name: Build portable
        shell: pwsh
        run: npm run build:portable
      - name: Compute version and tag
        id: version
        shell: pwsh
        run: |
          $input = '${{ github.event.inputs.version }}'
          if ($input.StartsWith('v')) { $tag = $input; $version = $input.Substring(1) } else { $tag = "v$input"; $version = $input }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        env:
          CHALLACHAT_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:installer
        shell: pwsh
      - name: Package portable zip
        run: ./scripts/windows/package-zip.ps1 -SourcePath build/challachat-portable -OutputPath build/challachat-win-portable.zip -Overwrite
        shell: pwsh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: challachat-windows-artifacts
          path: |
            build/challachat-setup.exe
            build/challachat-win-portable.zip

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: challachat-windows-artifacts
          path: dist
      - name: Generate release notes
        shell: bash
        run: |
          set -e
          git fetch origin main --tags --force
          PREV=$(git describe --abbrev=0 --tags 2>/dev/null || echo "")
          TAG='${{ needs.build-windows.outputs.tag }}'
          REPO_URL="https://github.com/${{ github.repository }}"
          RANGE="origin/main"
          if [ -n "$PREV" ]; then RANGE="$PREV..origin/main"; fi
          {
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV (main):"
            else
              echo "Changes on main:"
            fi
            echo
            git log --first-parent --pretty=format:'- %s (%h)' $RANGE
            echo
          } > release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: ChallaChat ${{ needs.build-windows.outputs.tag }}
          body_path: release_notes.md
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
