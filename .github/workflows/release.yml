name: Build Full Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (example: v1.5.0)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Compute version and tag
        id: version
        shell: pwsh
        run: |
          $input = '${{ github.event.inputs.version }}'
          if ($input.StartsWith('v')) { $tag = $input; $version = $input.Substring(1) } else { $tag = "v$input"; $version = $input }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          git tag $tag
      - name: Install dependencies
        shell: pwsh
        run: npm ci || npm install
      - name: Build portable
        shell: pwsh
        run: .\scripts\windows\build-portable.ps1
      - name: Build installer
        shell: pwsh
        run: .\scripts\windows\build-installer.ps1
      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path 'build\electron\win-unpacked\*' -DestinationPath 'build\electron\ChallaChat-Portable.zip' -Force
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: challachat-windows-artifacts
          path: |
            build/electron/ChallaChat-Setup.exe
            build/electron/ChallaChat-Portable.zip

  build-mac:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Compute version and tag
        id: version
        run: |
          INPUT='${{ github.event.inputs.version }}'
          if [[ "$INPUT" == v* ]]; then TAG="$INPUT"; VERSION="${INPUT#v}"; else TAG="v$INPUT"; VERSION="$INPUT"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git tag "$TAG"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build TypeScript
        run: npm run build
      - name: Build signed and notarized ZIP
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac zip --publish never
      - name: Rename artifact
        run: |
          cd build/electron
          mv *.zip ChallaChat-Mac-Portable.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: challachat-mac-artifacts
          path: |
            build/electron/ChallaChat-Mac-Portable.zip

  build-linux:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Compute version and tag
        id: version
        run: |
          INPUT='${{ github.event.inputs.version }}'
          if [[ "$INPUT" == v* ]]; then TAG="$INPUT"; VERSION="${INPUT#v}"; else TAG="v$INPUT"; VERSION="$INPUT"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git tag "$TAG"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build portable
        run: bash ./scripts/build-portable.sh
      - name: Package portable tar
        run: tar -czf build/electron/ChallaChat-Linux-Portable.tar.gz -C build/electron/linux-unpacked .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: challachat-linux-artifacts
          path: |
            build/electron/ChallaChat-Linux-Portable.tar.gz

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: challachat-windows-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: challachat-mac-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: challachat-linux-artifacts
          path: dist
      - name: Generate release notes
        shell: bash
        run: |
          set -e
          git fetch origin main --tags --force
          PREV=$(git describe --abbrev=0 --tags HEAD^ 2>/dev/null || echo "")
          TAG='${{ needs.build-windows.outputs.tag }}'
          if [ -n "$PREV" ]; then
            RANGE="$PREV..origin/main"
          else
            RANGE="origin/main"
          fi
          {
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"
            else
              echo "Initial release:"
            fi
            echo
            git log --first-parent --pretty=format:'- %s (%h)' $RANGE
            echo
          } > release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: ChallaChat ${{ needs.build-windows.outputs.tag }}
          body_path: release_notes.md
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
